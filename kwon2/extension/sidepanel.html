<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOICE BRIDGE</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #F7F8FA;
      --surface: #FFFFFF;
      --text: #111827;
      --accent: #075985;
      --danger: #B42318;
      --ok: #13795B;
      --muted: #475569;
      --border: #CBD5E1;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; min-width: 280px; line-height: 1.45; color: var(--text); background: var(--canvas); }
    h1 { margin: 0 0 4px; font-size: 1.35rem; }
    .subtitle { margin: 0 0 18px; color: var(--muted); font-size: .9rem; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--surface); }
    .status-row { display: flex; gap: 9px; align-items: flex-start; }
    .dot { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: var(--ok); }
    .dot.error { background: var(--danger); }
    #status { font-weight: 650; }
    #detail, #videoTitle, .hint { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
    #detail { margin-top: 3px; }
    #videoTitle { margin: 10px 0 0; }
    button { width: 100%; min-height: 44px; border: 0; border-radius: 9px; padding: 10px 14px; background: var(--accent); color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button[aria-pressed="true"] { background: var(--danger); }
    button.secondary { margin-top: 8px; color: var(--accent); background: var(--surface); border: 1px solid var(--accent); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button:focus-visible, input:focus-visible { outline: 3px solid #005FCC; outline-offset: 2px; }
    label { display: block; font-weight: 650; margin-bottom: 8px; }
    .range-row { display: grid; grid-template-columns: 1fr 3.5rem; gap: 10px; align-items: center; }
    input[type="range"] { width: 100%; min-height: 32px; }
    output { text-align: right; font-variant-numeric: tabular-nums; }
    .backend { display: flex; align-items: center; gap: 7px; margin-top: 14px; font-size: .82rem; color: var(--muted); }
    .backend button { width: auto; min-height: 32px; margin-left: auto; padding: 5px 9px; background: transparent; color: var(--accent); border: 1px solid var(--border); font-weight: 600; }
    progress { width: 100%; height: 12px; margin-top: 10px; accent-color: var(--accent); }
    .check-row { display: flex; gap: 9px; align-items: flex-start; }
    .check-row input { margin-top: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <header>
    <h1>VOICE BRIDGE</h1>
    <p class="subtitle">YouTube 화면해설</p>
  </header>

  <section class="card" aria-labelledby="currentStatusLabel">
    <h2 id="currentStatusLabel" class="sr-only">현재 상태</h2>
    <div class="status-row">
      <span id="statusDot" class="dot" aria-hidden="true"></span>
      <div>
        <div id="status" role="status" aria-live="polite">상태 확인 중</div>
        <div id="detail"></div>
      </div>
    </div>
    <p id="videoTitle"></p>
    <progress id="jobProgress" max="100" value="0" hidden aria-label="화면해설 생성 진행률"></progress>
    <p id="eta" class="hint" hidden></p>
  </section>

  <section class="card" aria-labelledby="pauseLabel">
    <div class="check-row">
      <input id="autoPause" type="checkbox" checked>
      <div>
        <label id="pauseLabel" for="autoPause">중요 해설에서 영상 잠시 멈춤</label>
        <p class="hint">자연 무음에 들어가지 않는 중요한 해설만 최대 8초 동안 재생합니다.</p>
      </div>
    </div>
  </section>

  <button id="toggle" type="button" aria-pressed="false" disabled>화면해설 켜기</button>
  <button id="regenerate" class="secondary" type="button" hidden aria-describedby="regenerateHint">새 분석으로 다시 생성</button>
  <p id="regenerateHint" class="hint" hidden>기존 해설은 유지하면서 새 문맥 분석을 실행합니다. API 비용이 발생합니다.</p>

  <section class="card" aria-labelledby="duckLabel" style="margin-top:12px">
    <label id="duckLabel" for="duckFactor">원본 소리 크기</label>
    <div class="range-row">
      <input id="duckFactor" type="range" min="0.1" max="1" step="0.05" value="0.35" aria-describedby="duckHint">
      <output id="duckValue" for="duckFactor">35%</output>
    </div>
    <p id="duckHint" class="hint">해설 중 원본 영상에 적용할 볼륨 비율입니다.</p>
  </section>

  <div class="backend">
    <span id="backendDot" class="dot" aria-hidden="true"></span>
    <span id="backendStatus">로컬 API 확인 중</span>
    <button id="retryHealth" type="button">다시 확인</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
